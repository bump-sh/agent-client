<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Widget preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100dvh;
        overflow: hidden;
        background: #fafafa;
        background-image: radial-gradient(#e6e6e9 1px, transparent 1px);
        background-size: 18px 18px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      /* A ghost of the host site, so the widget is seen in situ. */
      .site {
        max-width: 720px;
        margin: 0 auto;
        padding: 36px 32px;
      }
      .site .bar {
        height: 12px;
        border-radius: 6px;
        background: #ececee;
        margin-bottom: 14px;
      }
      .site nav {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 56px;
      }
      .site nav .bar {
        margin: 0;
      }
      .site .logo {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: #e0e0e3;
      }
      .site nav .bar {
        width: 56px;
      }
      .site nav .bar:first-of-type {
        margin-left: auto;
      }
      .site .hero {
        height: 26px;
        width: 62%;
        background: #e3e3e6;
        margin-bottom: 22px;
      }
      .site .bar:nth-child(3) {
        width: 92%;
      }
      .site .bar:nth-child(4) {
        width: 84%;
      }
      .site .bar:nth-child(5) {
        width: 40%;
      }

      /* Inline mode mounts the widget in a framed page region. */
      .inline-stage {
        display: none;
        position: absolute;
        inset: 28px;
        max-width: 760px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #ececee;
        border-radius: 16px;
        overflow: hidden;
      }
      body[data-mode="inline"] .inline-stage {
        display: block;
      }
      body[data-mode="inline"] .site {
        display: none;
      }

      /* Stand-in for the host site's own button when the launcher is off. */
      .trigger {
        display: none;
        position: fixed;
        right: 22px;
        bottom: 22px;
        align-items: center;
        padding: 11px 18px;
        font: inherit;
        font-weight: 500;
        color: #0d0d0d;
        background: #fff;
        border: 1px solid #e3e3e6;
        border-radius: 999px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
        cursor: pointer;
      }
      body[data-launcher="off"]:not([data-mode="inline"]) .trigger {
        display: inline-flex;
      }
    </style>
  </head>
  <body>
    <div class="site">
      <nav><div class="logo"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></nav>
      <div class="bar hero"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
    <div class="inline-stage" id="inline-stage"></div>
    <button class="trigger" id="trigger" type="button">Open the widget</button>
    <script src="./frame.js" defer></script>
  </body>
</html>
